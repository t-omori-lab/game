<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101413" />
    <link rel="icon" href="../../icon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="F.R.A.M. Character Forge F-01。AI生成Build Sheetから高密度ボクセル3D正本を再構築する技術検証画面。"
    />
    <title>F.R.A.M. Character Forge F-01</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #101413;
        color: #eef3ed;
        font-family: "Avenir Next Condensed", "Hiragino Sans", sans-serif;
      }

      .forge-boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        letter-spacing: 0.18em;
      }

      .forge-boot strong {
        font-size: 18px;
      }

      .forge-boot span {
        color: #7deadd;
        font-size: 9px;
      }

      .forge-boot i {
        width: 86px;
        height: 1px;
        margin: 5px auto 0;
        overflow: hidden;
        background: #28332f;
      }

      .forge-boot i::after {
        display: block;
        width: 42%;
        height: 100%;
        background: #7deadd;
        content: "";
        animation: forge-boot 1.1s ease-in-out infinite alternate;
      }

      @keyframes forge-boot {
        to { transform: translateX(138%); }
      }
    </style>
    <script>document.documentElement.dataset.framNavigationStart = String(performance.now())</script>
    <script type="module" crossorigin src="/game/assets/preload-helper-CeUGa9z8.js"></script>
    <script type="module" crossorigin src="/game/assets/prototypeRoutes-Dz52SadL.js"></script>

    <link rel="stylesheet" crossorigin href="/game/assets/styles-jLQHddpH.css">
  </head>
  <body>
    <main id="app" aria-label="F.R.A.M. Character Forge F-01">
      <div class="forge-boot" role="status">
        <strong>F.R.A.M.</strong>
        <span>CHARACTER FORGE / F-01</span>
        <i aria-hidden="true"></i>
      </div>
    </main>
  </body>
</html>
